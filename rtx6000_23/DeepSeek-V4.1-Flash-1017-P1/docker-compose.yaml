services:
  DeepSeek-V4.1-Flash-1017-P1:
    image: ghcr.io/yhfgyyf/vllm-deepseek-v4-sm89:0.28.1rc1-vision11-sm89-sm120-cu130
    #image: vllm/vllm-openai:cu134-nightly
    entrypoint: ["/bin/bash", "/opt/workspace/run.sh"]
    network_mode: host
    ipc: private
    volumes:
      - /data/models:/data/models:ro
      - /data/bluezone_llm_service/rtx6000_23/DeepSeek-V4.1-Flash-1017-P1:/opt/workspace
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/multi_connector.py:/opt/venv/lib/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/multi_connector.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/deepseek_v41.py:/opt/venv/lib/python3.12/site-packages/vllm/tokenizers/deepseek_v41.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/v1/core/kv_cache_coordinator.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/core/kv_cache_coordinator.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/v1/core/kv_cache_manager.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/core/kv_cache_manager.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/v1/core/sched/scheduler.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/core/sched/scheduler.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/v1/core/single_type_kv_cache_manager.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/core/single_type_kv_cache_manager.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/v1/request.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/request.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py:/opt/venv/lib/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/offloading/scheduler.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/coordinator.py:/opt/venv/lib/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/coordinator.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/data.py:/opt/venv/lib/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/data.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/protocol.py:/opt/venv/lib/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/protocol.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/scheduler.py:/opt/venv/lib/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/scheduler.py:ro
      - /data/bluezone_llm_service/rtx6000_23/vllm-compat/pr62400/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:/opt/venv/lib/python3.12/site-packages/vllm/distributed/kv_transfer/kv_connector/v1/mooncake/store/worker.py:ro
    environment:
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "4096"
      VIRTUAL_ENV: "/opt/venv"
      NVIDIA_VISIBLE_DEVICES: "4,5,6,7"
    security_opt:
      - seccomp:unconfined      # 解决 NUMA 系统调用被拦截的关键
    devices:
      - /dev/infiniband/rdma_cm:/dev/infiniband/rdma_cm
      - /dev/infiniband/uverbs4:/dev/infiniband/uverbs4
      - /dev/infiniband/uverbs5:/dev/infiniband/uverbs5
      - /dev/infiniband/umad4:/dev/infiniband/umad4
      - /dev/infiniband/umad5:/dev/infiniband/umad5
    shm_size: "32g"
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4","5","6","7"]
              capabilities: [gpu]

    restart: unless-stopped


